[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kasa"
version = "0.1.0"
description = "AI-assisted Linux Kernel Attack Surface Analyzer"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "DHARSHAN-14"}
]
keywords = [
    "linux",
    "kernel",
    "security",
    "cybersecurity",
    "attack-surface",
    "hardening",
    "ai",
    "security-analysis"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "typer>=0.16,<1",
    "rich>=14,<15",
]

[project.optional-dependencies]
ai = [
    "httpx>=0.27,<1",
]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "mypy>=1.17,<2",
    "ruff>=0.12,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
kasa = "kasa.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kasa"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "N",
    "S",
    "SIM",
    "RUF",
]
ignore = [
    "S101",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = [
    "^tests/",
]
